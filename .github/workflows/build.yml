name: APK derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradlew çalıştırılabilir yap
        run: chmod +x ./gradlew

      - name: Debug APK derle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Derleme logunu repoya yaz (her durumda)
        if: always()
        run: |
          mkdir -p dist
          cp /tmp/build.log dist/build.log || echo "log yok" > dist/build.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/build.log
          git commit -m "derleme logu [skip ci]" || echo "degisiklik yok"
          git push || echo "push basarisiz"

      - name: APK'yı dist/ klasörüne yaz
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          git add -f dist/app-debug.apk
          git commit -m "APK çıktısı [skip ci]" || echo "degisiklik yok"
          git push || echo "push basarisiz"

      - name: APK'yı artifact olarak yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
