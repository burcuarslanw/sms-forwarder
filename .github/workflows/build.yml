name: APK derle

# APK'yı bulutta derler ve indirilebilir çıktı olarak yükler.
# ubuntu-latest makinesinde Android SDK zaten kurulu gelir; ayrı kurulum gerekmez.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradlew çalıştırılabilir yap
        run: chmod +x ./gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
